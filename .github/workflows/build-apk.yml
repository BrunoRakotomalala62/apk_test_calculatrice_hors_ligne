name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          mkdir twa-project && cd twa-project
          bubblewrap init --manifest https://ice-hors-ligne.vercel.app/manifest.webmanifest --directory .

      - name: Build APK
        run: |
          cd twa-project
          bubblewrap build

      - name: Find APK
        id: find
        run: |
          APK=$(find twa-project -name "*.apk" -o -name "*.aab" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -la $APK

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-apk
          path: $ { steps.find.outputs.apk_path }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: APK - Calculatrice Hors Ligne
          tag_name: apk-latest
          files: $ { steps.find.outputs.apk_path }
          body: |
            ## 📱 Calculatrice PWA — APK Android
            
            Installez cette calculatrice sur votre téléphone Android :
            1. Téléchargez le fichier APK ci-dessous
            2. Ouvrez-le sur votre téléphone
            3. Autorisez l'installation depuis sources inconnues si demandé
            4. L'icône apparaît sur l'écran d'accueil
            
            **Fonctionne 100% hors ligne** après installation.
        env:
          GITHUB_TOKEN: $ { secrets.GITHUB_TOKEN }
